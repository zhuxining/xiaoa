pre-commit:
  parallel: true
  jobs:
    - name: biome check
      glob: "*.{js,ts,jsx,tsx,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    - name: markdown lint
      glob: "*.md"
      run: bunx markdownlint-cli2 --fix {staged_files}

    - name: typecheck
      run: bun run check-types