name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 单元测试
  tests-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # E2E 测试 - 多平台支持
  test-e2e:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run make

      - name: Run Smoke Tests
        run: npx playwright test --project=smoke
        env:
          CI: e2e

      - name: Run Session Tests
        run: npx playwright test --project=session
        env:
          CI: e2e

      - name: Run Chat Tests
        run: npx playwright test --project=chat
        env:
          CI: e2e

      - name: Run Workspace Tests
        run: npx playwright test --project=workspace
        env:
          CI: e2e

      - name: Run Integration Tests
        run: npx playwright test --project=integration
        env:
          CI: e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # E2E 测试结果汇总
  test-e2e-summary:
    needs: test-e2e
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check E2E Tests Status
        run: |
          if [ "${{ needs.test-e2e.result }}" == "failure" ]; then
            echo "E2E tests failed on one or more platforms"
            exit 1
          fi
          echo "All E2E tests passed"
